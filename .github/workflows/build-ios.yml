name: Build iPhone IPA
on:
  workflow_dispatch:
    inputs:
      simulator_only:
        description: Run only simulator verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app source
        working-directory: .
        run: unzip -q MoaPlayer-iOS-source.zip -d source
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version
      - name: Apply Swift format compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Moa/Runtime/Extractor.swift')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if 'opts["format"] = ' in line and 'PythonObject(' not in line:
                  prefix, value = line.split(' = ', 1)
                  lines[i] = prefix + ' = PythonObject(' + value + ')'
          p.write_text('\n'.join(lines) + '\n')
          p = Path('project.yml')
          text = p.read_text()
          if 'libbz2.tbd' not in text:
              text = text.replace('    dependencies:\n', '    dependencies:\n      - sdk: libbz2.tbd\n', 1)
          if 'ENABLE_DEBUG_DYLIB' not in text:
              text = text.replace('        CODE_SIGNING_ALLOWED: NO', '        CODE_SIGNING_ALLOWED: NO\n        ENABLE_DEBUG_DYLIB: NO')
          p.write_text(text)
          p = Path('Moa/MoaApp.swift')
          text = p.read_text()
          if '@FocusState private var searchFocused' not in text:
              text = text.replace('@State private var showHistory = false', '@State private var showHistory = false\n    @FocusState private var searchFocused: Bool')
              text = text.replace('.submitLabel(.search)', '.submitLabel(.search).focused($searchFocused)')
              text = text.replace('.onChange(of: query) { _, _ in showHistory = true }', '.onChange(of: query) { _, _ in if searchFocused { showHistory = true } }')
              text = text.replace('query = value; showHistory = false', 'searchFocused = false; query = value; showHistory = false')
          p.write_text(text)
          p = Path('ci/simulator-smoke.sh')
          text = p.read_text().replace('sorted(d,reverse=True)', 'sorted(d)')
          text = text.replace('CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1', 'CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee simulator-build.log')
          bounded = '''python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],timeout=180,check=True)' "$sim_id"'''
          text = text.replace('xcrun simctl bootstatus "$sim_id" -b', bounded)
          p.write_text(text)
          PY
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build device app
        if: ${{ !inputs.simulator_only }}
        run: |
          set -o pipefail
          xcodebuild -project Moa.xcodeproj -scheme Moa -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package unsigned IPA
        if: ${{ !inputs.simulator_only }}
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Moa.app package/Payload/
          test -f package/Payload/Moa.app/Moa
          cd package
          zip -qry ../MoaPlayer-iPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.simulator_only }}
        with:
          name: MoaPlayer-iPhone
          path: source/MoaPlayer-iPhone-unsigned.ipa
          retention-days: 7
      - name: Simulator runtime and offline playback check
        run: bash ci/simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-check
          path: |
            source/runtime-smoke.json
            source/simulator-screen.png
            source/simulator-build.log
            source/simulator-runtime.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics
          path: source/build.log
          retention-days: 3
